# Server Port Configuration
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Image/video uploads are stored on Cloudinary. Never commit real credentials.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Database Connection Settings (Microsoft SQL Server - SQL Server Authentication)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Spring Data JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
app.seed-demo-data=${SEED_DEMO_DATA:false}
app.seed-admin=${SEED_ADMIN:false}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.full-name=${ADMIN_FULL_NAME:}
app.admin.phone=${ADMIN_PHONE:}

# Demo account passwords used only when SEED_DEMO_DATA=true. Override these on any
# environment that is reachable from the internet so the defaults below (which are
# public in this repo) are not the real credentials.
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:Admin123@}
app.demo.staff-password=${DEMO_STAFF_PASSWORD:Staff123@}
app.demo.customer-password=${DEMO_CUSTOMER_PASSWORD:Chien123@}
app.repair-database-encoding=${REPAIR_DATABASE_ENCODING:false}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JSON representation of timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
# The environment variable should be set in production. The fallback key is
# Base64-encoded and intended only for local development.
app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
app.jwt.expiration-ms=86400000

# Swagger Configuration
springdoc.swagger-ui.path=/swagger

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.default-encoding=${MAIL_ENCODING}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT}

# Force use of national character sets (NVARCHAR/NCHAR) for SQL Server Vietnamese unicode support
spring.jpa.properties.hibernate.use_national_character_character_sets=true

# PayOS Payment Gateway Configuration
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

